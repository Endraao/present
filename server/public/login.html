<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Present · Connect Telegram</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f0c; --card:#121a14; --fg:#d9ffe0; --dim:#7fa889; --acc:#38f26a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; padding:16px; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid #1f2e22; border-radius:16px; padding:28px; }
  h1 { margin:0 0 4px; font-size:22px; color:var(--acc); letter-spacing:.02em; }
  p { margin:0 0 18px; color:var(--dim); }
  label { display:block; margin-bottom:6px; font-size:14px; color:var(--dim); }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #2b3f2f; background:#0d140f; color:var(--fg); font-size:18px; }
  button { margin-top:14px; width:100%; padding:12px; border:0; border-radius:10px; background:var(--acc); color:#04210c; font-weight:700; font-size:16px; cursor:pointer; }
  .err { color:#ff8a8a; margin-top:12px; min-height:1em; }
  code { display:block; margin-top:10px; padding:10px; border-radius:8px; background:#0d140f; word-break:break-all; color:var(--acc); }
</style>
</head>
<body>
<div class="card">
  <h1>Present</h1>
  <p id="lead">Connect your Telegram account. Your session stays on this computer; messages are never stored.</p>
  <form id="f">
    <label id="lbl" for="v">Phone number (with country code)</label>
    <input id="v" autocomplete="off" />
    <button>Continue</button>
  </form>
  <div id="done" hidden>
    <p>Signed in as <b id="me"></b>. Pairing token for the glasses app:</p>
    <code id="token"></code>
  </div>
  <div class="err" id="err"></div>
</div>
<script>
  const labels = {
    phone: ['Phone number (with country code)', 'tel'],
    code: ['Login code (sent to your Telegram app)', 'text'],
    password: ['Two-step verification password', 'password'],
  }
  let step = ''
  async function refresh() {
    const s = await fetch('/api/login').then(r => r.json())
    document.getElementById('err').textContent = s.error || ''
    if (s.step === 'done') {
      document.getElementById('f').hidden = true
      document.getElementById('done').hidden = false
      document.getElementById('me').textContent = s.me
      document.getElementById('token').textContent = s.token
      return
    }
    if (s.step !== step && labels[s.step]) {
      step = s.step
      document.getElementById('lbl').textContent = labels[step][0]
      const v = document.getElementById('v')
      v.type = labels[step][1]
      v.value = ''
      v.focus()
    }
    setTimeout(refresh, 1000)
  }
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault()
    const v = document.getElementById('v')
    await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value: v.value }) })
    v.value = ''
  })
  refresh()
</script>
</body>
</html>
